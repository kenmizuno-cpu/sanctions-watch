name: run-watch
description: 制裁リストを取得し、差分をマスターへ反映してコミット・通知・配布まで行う

inputs:
  sources:
    description: 監視対象 (mof / ofac / meti / all)
    required: true
  slack-webhook:
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip

    - name: 依存関係
      shell: bash
      run: pip install -r requirements.txt

    - name: 自己テスト
      shell: bash
      run: |
        python -m tests.test_offline
        python -m tests.test_mof_record_diff
        python -m tests.test_mof_re_review

    - name: 取得と差分抽出
      id: watch
      shell: bash
      run: python -m src.watch --sources ${{ inputs.sources }}

    - name: 財務省 原本レコード差分
      id: mof_record_diff
      if: contains(inputs.sources, 'mof') || inputs.sources == 'all'
      shell: bash
      run: python -m src.mof_record_diff

    - name: 財務省 再審査キュー生成
      if: contains(inputs.sources, 'mof') || inputs.sources == 'all'
      shell: bash
      run: python -m src.mof_re_review

    - name: Excel を再生成
      # マスターに実変更があった回だけ作り直す。毎時バイナリをコミットすると
      # リポジトリが膨らむため。
      if: steps.watch.outputs.has_diff == 'true'
      shell: bash
      run: python -m src.export_excel

    - name: 社内取込用差分 Excel を生成
      id: internal_diff
      if: steps.watch.outputs.has_diff == 'true'
      shell: bash
      run: |
        TS="$(TZ=Asia/Tokyo date +'%Y%m%d_%H%M%S')"
        OUT="dist/internal_import_${TS}.xlsx"

        python -m src.export_diff_excel --out "$OUT"

        if [ -f "$OUT" ]; then
          cp "$OUT" dist/internal_import_latest.xlsx
          echo "has_actionable=true" >> "$GITHUB_OUTPUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "artifact_name=internal-import-${TS}" >> "$GITHUB_OUTPUT"
        else
          echo "has_actionable=false" >> "$GITHUB_OUTPUT"
        fi

    - name: コミット
      shell: bash
      env:
        HAS_DIFF: ${{ steps.watch.outputs.has_diff }}
        MOF_SOURCE_CHANGED: ${{ steps.mof_record_diff.outputs.source_changed }}
        MOF_MATERIAL_CHANGED: ${{ steps.mof_record_diff.outputs.material_changed }}
      run: |
        git config user.name  "sanctions-watch[bot]"
        git config user.email "sanctions-watch@users.noreply.github.com"
        git add -A data/
        if git diff --cached --quiet; then
          echo "コミットするものが無い"
          exit 0
        fi
        # 意味のある履歴だけ後から追えるよう、メッセージを用途別に分ける
        if [ "$HAS_DIFF" = "true" ]; then
          MSG="feat(diff): 制裁リスト差分 追加${{ steps.watch.outputs.added }} 削除${{ steps.watch.outputs.removed }} 変更${{ steps.watch.outputs.changed }}"
        elif [ "$MOF_MATERIAL_CHANGED" = "true" ]; then
          MSG="feat(mof): 原本差分 追加${{ steps.mof_record_diff.outputs.added }} 削除${{ steps.mof_record_diff.outputs.removed }} 情報改訂${{ steps.mof_record_diff.outputs.amended }}"
        elif [ "$MOF_SOURCE_CHANGED" = "true" ]; then
          MSG="chore(mof): 原本更新・実質変更なし"
        elif git diff --cached --name-only | grep -qv '^data/heartbeat/'; then
          MSG="chore(state): 取得状態を更新"
        else
          MSG="chore(heartbeat): 定期チェック記録"
        fi
        git commit -m "$MSG"
        for i in 1 2 3; do
          git pull --rebase --autostash && git push && exit 0
          sleep $((i * 5))
        done
        exit 1

    - name: GitHub Release の最新版を更新
      if: steps.watch.outputs.has_diff == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        HAS_ACTIONABLE: ${{ steps.internal_diff.outputs.has_actionable }}
      run: |
        FILES=(
          "dist/black_receiver_name_all.xlsx"
          "data/diff/latest.csv"
        )

        if [ "$HAS_ACTIONABLE" = "true" ]; then
          FILES+=("dist/internal_import_latest.xlsx")
        else
          # 今回の差分に社内反映対象が無い場合、
          # 前回のファイルを最新と誤認して再取込しないよう削除する。
          gh release delete-asset latest internal_import_latest.xlsx             --yes             --repo "$GITHUB_REPOSITORY"             2>/dev/null || true
        fi

        gh release upload latest "${FILES[@]}"           --clobber           --repo "$GITHUB_REPOSITORY"

    - name: 社内取込差分を Actions Artifact に保存
      if: steps.internal_diff.outputs.has_actionable == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.internal_diff.outputs.artifact_name }}
        path: ${{ steps.internal_diff.outputs.path }}
        retention-days: 90
        if-no-files-found: error

    - name: 差分を通知
      if: steps.watch.outputs.has_diff == 'true'
      shell: bash
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.slack-webhook }}
      run: |
        python -m src.notify --kind diff \
          --added   "${{ steps.watch.outputs.added }}" \
          --removed "${{ steps.watch.outputs.removed }}" \
          --changed "${{ steps.watch.outputs.changed }}"

    - name: 経産省の更新を通知
      if: steps.watch.outputs.meti_updated == 'true'
      shell: bash
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.slack-webhook }}
      run: python -m src.notify --kind meti

    - name: OFAC 失敗証跡を準備
      if: failure() && (contains(inputs.sources, 'ofac') || inputs.sources == 'all')
      shell: bash
      run: |
        set -u

        EVIDENCE=".failure-evidence"
        rm -rf "$EVIDENCE"

        mkdir -p           "$EVIDENCE/data/source_audit"           "$EVIDENCE/data/heartbeat"           "$EVIDENCE/data/dashboard"           "$EVIDENCE/data/raw"

        {
          echo "captured_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "GITHUB_RUN_ID=${GITHUB_RUN_ID:-}"
          echo "GITHUB_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT:-}"
          echo "GITHUB_SHA=${GITHUB_SHA:-}"
          echo "sources=${{ inputs.sources }}"
          echo ""
          echo "===== git status --short ====="
          git status --short --untracked-files=all || true
        } > "$EVIDENCE/manifest.txt"

        git status --short --untracked-files=all           > "$EVIDENCE/git-status.txt" || true

        git diff           > "$EVIDENCE/worktree.diff" || true

        git diff --cached           > "$EVIDENCE/index.diff" || true

        if [ -d data/source_audit/ ]; then
          cp -a             data/source_audit/.             "$EVIDENCE/data/source_audit/"
        fi

        if [ -d data/heartbeat/ ]; then
          cp -a             data/heartbeat/.             "$EVIDENCE/data/heartbeat/"
        fi

        if [ -f data/state.json ]; then
          cp -p             data/state.json             "$EVIDENCE/data/state.json"
        fi

        if [ -f data/dashboard/status.csv ]; then
          cp -p             data/dashboard/status.csv             "$EVIDENCE/data/dashboard/status.csv"
        fi

        # 今回のrunで新規取得したOFAC rawだけを保存する。
        # 過去全世代をArtifactへ重複保存しない。
        for RAW_ROOT in           data/raw/ofac_sdn/           data/raw/ofac_sdn_advanced/           data/raw/ofac_cons/           data/raw/ofac_cons_advanced/
        do
          ROOT_NO_SLASH="${RAW_ROOT%/}"

          if [ ! -d "$ROOT_NO_SLASH" ]; then
            continue
          fi

          git ls-files             --others             --exclude-standard             -- "$ROOT_NO_SLASH" |
          while IFS= read -r SRC
          do
            [ -f "$SRC" ] || continue

            DEST="$EVIDENCE/$SRC"
            mkdir -p "$(dirname "$DEST")"
            cp -p "$SRC" "$DEST"

            {
              printf '%s  ' "$(shasum -a 256 "$SRC" | awk '{print $1}')"
              wc -c < "$SRC" | tr -d ' '
              printf ' bytes  %s\n' "$SRC"
            } >> "$EVIDENCE/raw-files.txt"
          done
        done

        echo ""
        echo "===== FAILURE EVIDENCE ====="
        find "$EVIDENCE" -type f -print | sort

    - name: OFAC 失敗証跡を保存
      if: failure() && (contains(inputs.sources, 'ofac') || inputs.sources == 'all')
      uses: actions/upload-artifact@v4
      with:
        name: ofac-failure-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: .failure-evidence/
        retention-days: 90
        if-no-files-found: error

    - name: 失敗を通知
      if: failure()
      shell: bash
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.slack-webhook }}
      run: python -m src.notify --kind failure
