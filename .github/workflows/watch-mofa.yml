name: watch-mofa
on:
  pull_request:
    paths: ['src/**', 'tests/**', 'apps_script/**', '.github/actions/run-watch/**', '.github/workflows/watch-ofac.yml', '.github/workflows/watch-mofa.yml', 'requirements*.txt', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: pip install -r requirements.txt
      - name: Offline verification only
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python -m tests.test_offline
          python -m tests.test_e2e
          python -m tests.test_mof_record_diff
          python -m tests.test_mof_re_review
          node --test tests/test_mofa_gas.cjs
          node --test tests/test_ofac_watchdog.cjs
          node tests/test_crypto_dashboard.cjs
          git diff --check
