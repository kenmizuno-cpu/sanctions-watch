name: watch-meti-html

# METI RSSはGitHub Hosted Runnerから403となるため、
# METI公式HTMLを15分ごとの更新候補センサーとして二重監視する。
#
# A: 対外経済ニュースリリース一覧
# B: 安全保障貿易管理「改正情報」
#
# 候補検知 != 正式反映。
# 候補時のみ既存のMETI公式リスト確認へ進む。

on:
  schedule:
    # OFAC(17分)・国内監視(37分)との同時実行を避ける。
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sanctions-watch-commit
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存関係
        run: pip install -r requirements.txt

      - name: METI HTML オフラインテスト
        run: python -m unittest tests.test_meti_html

      - name: METI公式HTML更新候補検知
        id: sensor
        continue-on-error: true
        run: python -m src.meti_html

      - name: 候補検知時に外国ユーザーリスト公式側を即時確認
        id: confirm
        if: steps.sensor.outputs.candidate == 'true'
        continue-on-error: true
        run: python -m src.watch --sources meti

      - name: ダッシュボード・監査証跡をコミット
        if: always()
        env:
          CANDIDATE: ${{ steps.sensor.outputs.candidate }}
          SENSOR_OUTCOME: ${{ steps.sensor.outcome }}
          CONFIRM_OUTCOME: ${{ steps.confirm.outcome }}
        run: |
          git config user.name "sanctions-watch[bot]"
          git config user.email "sanctions-watch@users.noreply.github.com"

          git add -A data/

          if git diff --cached --quiet; then
            echo "コミットする変更なし"
            exit 0
          fi

          if [ "$SENSOR_OUTCOME" != "success" ]; then
            MSG="fix(meti-html): HTML監視異常を記録"
          elif [ "$CANDIDATE" = "true" ]; then
            MSG="feat(meti-html): 外国ユーザーリスト更新候補を検知"
          else
            MSG="chore(meti-html): HTML baseline/state更新"
          fi

          git commit -m "$MSG"

          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done

          exit 1

      - name: HTMLセンサー異常をWorkflow失敗として確定
        if: steps.sensor.outcome != 'success'
        run: |
          echo "METI HTMLセンサーが失敗。監査証跡を記録済み。"
          exit 1

      - name: 公式確認工程の異常をWorkflow失敗として確定
        if: steps.confirm.outcome == 'failure'
        run: |
          echo "METI公式側の確認工程が失敗。監査証跡を確認してください。"
          exit 1
