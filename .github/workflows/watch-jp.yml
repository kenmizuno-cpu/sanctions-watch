name: watch-jp

# 財務省の公式リストを6時間ごとに監視する。経産省は手動監視へ移行する。
# OFAC と分の位置をずらして、同じ concurrency グループでの待ちを減らす。
on:
  schedule:
    - cron: "37 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sanctions-watch-commit
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/run-watch
        with:
          sources: mof
          slack-webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
