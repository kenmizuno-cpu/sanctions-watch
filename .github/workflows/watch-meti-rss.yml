name: watch-meti-rss

# METI RSSは更新候補の検知センサー。
# Slack通知は使わず data/dashboard/changes.csv へ記録し、
# 既存のGoogle Sheets 15分同期で制裁リスト監視ダッシュボードへ表示する。
on:
  schedule:
    # RSS更新候補を15分以内に検知。
    # OFAC(17分)・国内監視(37分)との同時実行を避ける。
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sanctions-watch-commit
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存関係
        run: pip install -r requirements.txt

      - name: METI RSS オフラインテスト
        run: python -m unittest tests.test_meti_rss

      - name: RSS新着検知
        id: rss
        continue-on-error: true
        run: python -m src.meti_rss

      - name: 候補検知時に外国ユーザーリスト公式側を即時確認
        id: confirm
        if: steps.rss.outcome == 'success' && steps.rss.outputs.candidate == 'true'
        continue-on-error: true
        run: python -m src.watch --sources meti

      - name: ダッシュボード記録・監査証跡をコミット
        if: always()
        env:
          CANDIDATE: ${{ steps.rss.outputs.candidate }}
          RSS_OUTCOME: ${{ steps.rss.outcome }}
          CONFIRM_OUTCOME: ${{ steps.confirm.outcome }}
        run: |
          git config user.name  "sanctions-watch[bot]"
          git config user.email "sanctions-watch@users.noreply.github.com"

          git add -A data/

          if git diff --cached --quiet; then
            echo "コミットする変更なし"
            exit 0
          fi

          if [ "$RSS_OUTCOME" != "success" ]; then
            MSG="fix(meti-rss): RSS監視異常をダッシュボードへ記録"
          elif [ "$CANDIDATE" = "true" ]; then
            MSG="feat(meti-rss): 外国ユーザーリスト更新候補を検知"
          else
            MSG="chore(meti-rss): RSS baseline/state更新"
          fi

          git commit -m "$MSG"

          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((i * 5))
          done

          exit 1

      - name: RSSセンサー異常をWorkflow失敗として確定
        if: steps.rss.outcome != 'success'
        run: |
          echo "METI RSSセンサーが失敗。ダッシュボードへ異常記録済み。"
          exit 1

      - name: 公式確認工程の異常をWorkflow失敗として確定
        if: steps.confirm.outcome == 'failure'
        run: |
          echo "METI公式側の確認工程が失敗。GitHub監査証跡を確認してください。"
          exit 1

